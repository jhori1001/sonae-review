name: Refresh Rakuten product data

# Weekly: updates price, Rakuten review count/average, images and
# description for the listed products and opens a pull request with the changes, so nothing reaches
# the live site until it's merged. Needs the repository secrets
# RAKUTEN_APP_ID, RAKUTEN_ACCESS_KEY and RAKUTEN_AFFILIATE_ID.
on:
  schedule:
    - cron: "17 19 * * 0" # Mondays 04:17 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh prices
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: node refresh-rakuten-prices.mjs
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/refresh-prices
          commit-message: Refresh Rakuten prices and review counts
          title: Refresh Rakuten prices and review counts
          body: Weekly automatic update of price, review count, review average, images and description for the listed Rakuten products.
          add-paths: src/lib/real-products.generated.ts
